detectors="io.syspulse.ext.sentinel.DetectorNews"

# Comma-separated feed URIs (file:// or https://)
# Examples:
  #   file://./rss/coingtelegraph-all.rss.xml
  #   https://cointelegraph.com/rss
  #   file://./reddit/reddit-1.xml
  #   https://www.reddit.com/domain/howtogeek.com.rss

detector {
    did = "DetectorNews"

    contract="News-RSS"
    chain=""

    conf="""{
        "cron": "5000",
        "desc": ">>>>>>>>>>>>>>>>>>>>>>>>>>>> {title}{err}",

        "type": "news",
        "feeds": "file://./rss/coingtelegraph-all.rss",

        "max": 10,
        "max_seen_posts": 100,

        "threshold": ">= 0.5",

        "script": [
            {
                "type": "regexp_score",
                "src": "(?i).*(Ether|Bitcoin).*"
            }
        ],

        "track_err": true,
        "err_always": true
    }"""

