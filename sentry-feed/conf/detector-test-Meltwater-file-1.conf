include "default-core"
include "application-dev.conf"

detectors="io.syspulse.ext.sentinel.DetectorMeltwater"

detector {
    did = "DetectorMeltwater"

    contract="Meltwater-Feed"
    chain=""

    conf="""{
        "cron": "5000",
        "desc": "Meltwater: {title}{err}",

        "type": "meltwater",
        # Feed URI forms:
        #   meltwater://<id>,<id>            query the Search API (POST /v3/search/{id}); empty = list+query all searches
        #   file://path.json / https / plain a saved Search API JSON response (primary format)
        #   csv://path.csv                   a Meltwater CSV export (treated like file://, parsed as CSV)
        "feeds": "csv://./meltwater/Examples/export-twitter-1.csv",
        # "feeds": "meltwater://28737363,28739045",
        # "api_key": "${MELTWATER_API_KEY}",
        # "window": "24h",
        # "page_size": 10,

        "source": "",
        "influencer": "",
        "country": "",
        "language": "",
        "reach": "",
        "social_echo": "",
        "document_tags": "",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
