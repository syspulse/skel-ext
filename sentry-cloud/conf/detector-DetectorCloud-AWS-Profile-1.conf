include "default-core"
include "application-dev.conf"

# AWS with a profile from shared credentials file (refreshable, e.g. AWS SSO).
#
# ~/.aws/credentials:
#   [sentry]
#   credential_process = /path/to/sentry-cloud/bin/aws-credential-process.sh haas-dev
#
# SSO session must be valid: aws sso login --profile haas-dev
#
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloud-AWS-Profile-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS"
    chain=""

    conf="""{
        "cron": "1 min",

        "uri": "aws://?region=eu-west-1&profile=sentry&states=ALARM,INSUFFICIENT_DATA",
        "system": "Watch",
        "condition": "> 0",
        "new_only": true,

        "desc": "{system}: {title}{err}",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
