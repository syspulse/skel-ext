include "default-core"
include "application-dev.conf"

# AWS CloudWatch (system: Watch): alarms of EC2, EKS and VPC (NAT/VPN) health
#
# Credentials: environment (AWS_ACCESS_KEY, AWS_ACCESS_SECRET, AWS_SESSION_TOKEN, AWS_REGION)
#   or standard AWS variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) or AWS default credentials chain
#   source /tmp/env.dev
#
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloud-AWS-Watch-1.conf
#
# URI params:
#   states       - alarm states to report: ALARM,INSUFFICIENT_DATA
#   namespace    - metric namespaces filter: AWS/EC2,AWS/EKS,AWS/NATGateway,AWS/VPN
#   alarm_prefix - alarm name prefix filter

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS-Watch"
    chain=""

    conf="""{
        "cron": "1 min",
        
        "uri": "aws://?region=eu-west-1&states=ALARM,INSUFFICIENT_DATA&namespace=AWS/EC2,AWS/EKS,AWS/NATGateway,AWS/VPN",
        "system": "Watch",
        "condition": "> 0",
        "new_only": true,

        "desc": "CloudWatch {state}: {alarm} {reason}",

        "track_err": true,
        "err_always": false
    }"""

    output="err://"
}
