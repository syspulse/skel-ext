include "default-core"
include "application-dev.conf"

# AWS with `auth` (AuthURI). It has a preference over credentials in `uri`.
#
#   "auth": "env://"                                       default environment variables (AWS_ACCESS_KEY, AWS_ACCESS_SECRET, AWS_SESSION_TOKEN)
#   "auth": "env://$MY_KEY:$MY_SECRET"                     custom environment variables (no SESSION_TOKEN: it is requested and refreshed)
#   "auth": "role://"                                      IAM role of the pod/task/instance
#   "auth": "role://?arn=arn:aws:iam::123456789012:role/Sentry&external_id=abc"
#   "auth": "profile://?profile=sentry"                    ~/.aws/credentials (credential_process, SSO: see bin/aws-credential-process.sh)
#   "auth": "secret://{AWS_ACCESS_KEY}:{AWS_ACCESS_SECRET}"
#
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloud-AWS-Auth-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS-Auth"
    chain=""

    conf="""{
        "cron": "1 min",

        "uri": "aws://?region=eu-west-1&states=ALARM,INSUFFICIENT_DATA",
        "auth": "env://",
        "system": "Watch",
        "condition": "> 0",
        "track_new": true,

        "desc": "{system}: {title}{err}",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
