include "default-core"
include "application-dev.conf"

# GCP Cloud Monitor (mocked). System is selected from Cloud Monitoring, Cloud Audit Logs, Cloud IAM, Cloud Storage.
#
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloudGCP-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloudGCP"

detector {
    did = "DetectorCloudGCP"

    contract="GCP"
    chain=""

    conf="""{
        "cron": "1 min",

        "uri": "gcp://?project=mock-project&mock=alarm",
        "system": "Cloud Monitoring",
        "condition": "> 0",
        "track_new": true,

        "desc": "{sys}: {title}{err}",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
