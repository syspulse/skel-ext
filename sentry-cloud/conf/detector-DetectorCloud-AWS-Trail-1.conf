include "default-core"
include "application-dev.conf"

# AWS CloudTrail (system: Trail): IAM changes in the last hour
#
# Credentials: environment (see detector-DetectorCloud-AWS-Watch-1.conf)
#
# Run:
#   source /tmp/env.dev; ../sentinel.sh --conf=conf/detector-DetectorCloud-AWS-Trail-1.conf
#
# URI params:
#   source       - event sources (comma-separated): iam.amazonaws.com,s3.amazonaws.com. Empty = all (write events)
#   events       - event names filter: CreateUser,DeleteUser,AttachUserPolicy
#   window       - minutes to look back (CloudTrail events are delayed by several minutes)
#   trail_region - region of CloudTrail (global services like IAM are always in us-east-1)

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS-Trail"
    chain=""

    conf="""{
        "cron": "5 min",
        
        "uri": "aws://?region=eu-west-1&source=iam.amazonaws.com&window=60",
        "system": "Trail",
        "condition": "> 0",
        "new_only": true,

        "desc": "CloudTrail: {title}"
    }"""

    output="err://"
}
