include "default-core"
include "application-dev.conf"

# AWS mock (moto): CloudWatch, IAM, S3 (CloudTrail lookup is NOT supported by moto)
#
# Start mock:
#   ../mock/moto.sh start
# Dummy credentials are required by AWS SDK:
#   export AWS_ACCESS_KEY=test AWS_ACCESS_SECRET=test
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloud-AWS-Moto-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS-Moto"
    chain=""

    conf="""{
        "cron": "10 sec",
        
        "uri": "aws://localhost:5000?region=us-east-1&ssl=false&states=ALARM,INSUFFICIENT_DATA",
        "system": "Watch,IAM,Storage",
        "condition": "> 0",
        "new_only": true
    }"""

    output="err://"
}
