include "default-core"
include "application-dev.conf"

# Mocked GCP (no credentials needed). mock=alarm|ok|fail

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="GCP"
    chain=""

    conf="""{
        "cron": "1 min",
        
        "uri": "gcp://?project=test&mock=alarm",
        "system": "Watch,Trail,IAM,Storage",
        "condition": "> 0",
        "track_new": true
    }"""

    output="err://"
}
