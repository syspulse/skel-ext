include "default-core"
include "application-dev.conf"

# AWS Cloud Monitor (DetectorCloudAWS). System is selected from CloudWatch, CloudTrail, IAM, S3.
#
# Credentials: `auth` (preferred) or environment (see detector-DetectorCloud-AWS-Auth-1.conf)
#
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloudAWS-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloudAWS"

detector {
    did = "DetectorCloudAWS"

    contract="AWS"
    chain=""

    conf="""{
        "cron": "1 min",

        "uri": "aws://?region=eu-west-1&states=ALARM,INSUFFICIENT_DATA",
        "auth": "env://",
        "system": "CloudWatch",
        "condition": "> 0",
        "track_new": true,

        "desc": "{sys}: {title}{err}",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
