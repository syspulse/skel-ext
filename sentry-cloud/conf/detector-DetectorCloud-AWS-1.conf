include "default-core"
include "application-dev.conf"

# Basic AWS integration test (CloudWatch alarms)
#
# Credentials are taken from environment:
#   export AWS_ACCESS_KEY=...
#   export AWS_ACCESS_SECRET=...
#   export AWS_SESSION_TOKEN=...   (optional)
#   export AWS_REGION=eu-west-1
# or from AWS default credentials chain (~/.aws/credentials, instance profile)
#
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloud-AWS-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS"
    chain=""

    conf="""{
        "cron": "1 min",
        
        "uri": "aws://?region=eu-west-1&states=ALARM,INSUFFICIENT_DATA",
        "system": "Watch",
        "condition": "> 0",
        "new_only": true,

        "desc": "{system}: {title}{err}",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
