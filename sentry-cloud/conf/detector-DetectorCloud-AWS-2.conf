include "default-core"
include "application-dev.conf"

# AWS: IAM (credential report) and Storage (S3 availability)
# credentials: AWS_ACCESS_KEY, AWS_ACCESS_SECRET, AWS_SESSION_TOKEN, AWS_REGION (environment)

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS"
    chain=""

    conf="""{
        "cron": "10 min",
        
        "uri": "aws://?region=eu-west-1&max_key_age=90&latency=3000",
        "system": "IAM,Storage",
        "condition": "> 0",
        "new_only": true
    }"""

    output="err://"
}
