include "default-core"
include "application-dev.conf"

# Azure Cloud Monitor (mocked). System is selected from Azure Monitor, Activity Log, Entra ID, Blob Storage.
#
# Run:
#   ../sentinel.sh --conf=conf/detector-DetectorCloudAzure-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloudAzure"

detector {
    did = "DetectorCloudAzure"

    contract="Azure"
    chain=""

    conf="""{
        "cron": "1 min",

        "uri": "azure://?subscription=mock-subscription&mock=alarm",
        "system": "Azure Monitor",
        "condition": "> 0",
        "track_new": true,

        "desc": "{sys}: {title}{err}",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
