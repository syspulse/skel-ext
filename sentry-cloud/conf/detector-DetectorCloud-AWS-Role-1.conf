include "default-core"
include "application-dev.conf"

# AWS with REFRESHABLE credentials
#
# Production (ECS/EKS/EC2): no credentials at all. IAM role of the host/pod is used and refreshed by AWS SDK:
#   "uri": "aws://?region=eu-west-1"
#
# Assume a role (credentials are refreshed automatically before they expire).
# Base credentials (to call STS) are taken from environment or AWS default chain:
#   "uri": "aws://?region=eu-west-1&role_arn=arn:aws:iam::123456789012:role/Sentry&external_id=abc"
#
# Developer machine (AWS SSO): profile in ~/.aws/credentials
#   [sentry]
#   credential_process = /path/to/sentry-cloud/bin/aws-credential-process.sh haas-dev
#
# Run:
#   AWS_ROLE_ARN=arn:aws:iam::123456789012:role/Sentry ../sentinel.sh --conf=conf/detector-DetectorCloud-AWS-Role-1.conf

detectors="io.syspulse.ext.sentinel.DetectorCloud"

detector {
    did = "DetectorCloud"

    contract="AWS"
    chain=""

    conf="""{
        "cron": "1 min",

        "uri": "aws://?region=eu-west-1&role_arn={AWS_ROLE_ARN}&states=ALARM,INSUFFICIENT_DATA",
        "system": "Watch",
        "condition": "> 0",
        "new_only": true,

        "desc": "{system}: {title}{err}",

        "track_err": true,
        "err_always": true
    }"""

    output="err://"
}
